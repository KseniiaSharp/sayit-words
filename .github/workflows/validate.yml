name: Validate word packs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate packs
        shell: pwsh
        run: ./tools/validate.ps1
      - name: Check index.json is up to date
        shell: pwsh
        run: ./tools/build-index.ps1 -Check
